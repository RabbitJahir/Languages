<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2 id="teXt">Stylish</h2>
    <button onclick="change()">Change text style</button>

    <script>
      function change() {
        // gets element from their id, id = id, 
        let change = document.getElementById("teXt");
        change.style.color = "red";
        change.style.fontSize = "30px";
      }
    </script>
  </body>
</html>
