<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="box"></div>

    <script>
      // creates html element but inside js, takes up memmory
      let newElement = document.createElement("p");
      newElement.innerText = "New paragraph added!";

      document.getElementById("box").appendChild(newElement);

      for (let i = 1; i <= 3; i++) {
        let p = document.createElement("p");
        p.innerText = "Item " + i;
        // adds to the body of the frontpage
        document.body.appendChild(p);
      }
    </script>
  </body>
</html>
