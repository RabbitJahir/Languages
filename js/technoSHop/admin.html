<!doctype html>
<!-- 
  Blood God's Vault - Admin Management Page
  This is the admin dashboard where administrators can update product prices and inventory quantities.
  Only users with 'admin' role can access this page.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Blood God's Vault</title>
    <!-- Link to admin-specific styling -->
    <link rel="stylesheet" href="style/admin.css" />
    <!-- Bootstrap Icons for UI elements -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- Custom Google Fonts: Cinzel Decorative for headings, Crimson Pro for body text -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation Bar: Brand logo, admin session info, and logout -->
    <nav class="navbar">
      <div class="brand">
        <!-- Brand icon and site name -->
        <span class="brand-icon">⚔</span>
        <div class="brand-text">
          <h1>Blood God's Vault</h1>
          <!-- Admin badge to visually distinguish admin page -->
          <span class="brand-sub"><span class="admin-pill">ADMIN</span></span>
        </div>
      </div>
      <div class="nav-right">
        <!-- Session label will show admin username -->
        <span class="session-label" id="sessionLabel"></span>
        <!-- Logout button - clears session and redirects to login page -->
        <button class="btn-logout" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </nav>

    <!-- Main content area for admin dashboard -->
    <main class="admin-main">
      <!-- Header section with page title and description -->
      <div class="admin-header">
        <h2 class="page-title">Manage Inventory</h2>
        <p class="page-sub">Update prices and stock</p>
      </div>
      <!-- Admin grid: Individual product management cards will be generated by admin.js -->
      <div class="admin-grid" id="adminGrid"></div>
    </main>

    <!-- Toast notification container: Shows success/error messages for admin actions -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <!-- JavaScript files: executed in order, must load shared.js first for shared functions -->
    <!-- shared.js: Contains shared utility functions for all pages (auth, store operations) -->
    <script src="shared.js"></script>
    <!-- admin.js: Contains admin-specific logic for managing items (edit prices, quantities) -->
    <script src="admin.js"></script>
  </body>
</html>
