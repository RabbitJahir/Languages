<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>objects</title>
  </head>
  <body>
    <script>
      const product = {
        //property = value
        name: "socks",
        price: 123,
      };
      //caling
      console.log(`starting`);
      console.log(product);
      console.log(typeof product);

      // dot notation
      console.log(`product name: ${product.name}`);

      // changing value using properties
      product.name = `t-shirt`;
      console.log(product);

      // can add new properties
      product.newProperty = true;
      console.log(`with new property: `);
      console.log(product);

      // can delete too
      delete product.newProperty;
      console.log(product);
    </script>
  </body>
</html>
