<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame(`rock`)">Rock</button>

    <button onclick="playGame(`paper`)">Paper</button>

    <button onclick="playGame(`scissor`)">Scissor</button>

    //using objects
    <button onClick="scores.losses=0;scores.ties=0; scores.wins=0">
      Reset score
    </button>
    <script>
      // object score
      const scores = {
        wins: 0,
        losses: 0,
        ties: 0,
      };
      function playGame(playerMove) {
        const commove = pickComMove();
        let result = ``;

        if (playerMove === `scissor`) {
          if (commove === `rock`) {
            result = `lose`;
          } else if (commove === `paper`) {
            result = `win`;
          } else if (commove === `scissor`) {
            result = `tied`;
          }
        } else if (playerMove === "paper") {
          if (commove === `rock`) {
            result = `win`;
          } else if (commove === `paper`) {
            result = `tied`;
          } else if (commove === `scissor`) {
            result = `lose`;
          }
        } else if (playerMove === `rock`) {
          if (commove === `rock`) {
            result = `tied`;
          } else if (commove === `paper`) {
            result = `lose`;
          } else if (commove === `scissor`) {
            result = `win`;
          }
        }

        // using objects
        if (result === `win`) {
          scores.wins++;
        } else if (result === `lose`) {
          scores.losses++;
        } else {
          scores.ties++;
        }

        alert(`You chose ${playerMove}, computer chose ${commove},
                you ${result}\n wins: ${scores.wins}, losses: ${scores.losses}, ties: ${scores.ties}`);
      }

      function pickComMove() {
        const randomnum = Math.random();

        let commove = ``;

        if (randomnum && randomnum < 1 / 3) {
          commove = `rock`;
        } else if (randomnum >= 1 / 3 && randomnum < 2 / 3) {
          commove = `paper`;
        } else if (randomnum >= 2 / 3 && randomnum <= 1) {
          commove = `scissor`;
        }
        return commove;
      }
    </script>
  </body>
</html>
