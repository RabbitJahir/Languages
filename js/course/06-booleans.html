<!doctype html>
<html lang="en">
  <head>

    <title>Document</title>

  <body>
    <p>Rock Paper Scissors</p>
    <button
      onclick="
        const randomnum = Math.random();
        let commove = ``;

        if (randomnum && randomnum < 1 / 3) {
          commove = `rock`;
        } else if (randomnum >= 1 / 3 && randomnum < 2 / 3) {
          commove = `paper`;
        } else if (randomnum >= 2 / 3 && randomnum <= 1) {
          commove = `scissor`;
        }

        let result = ``;

        if (commove === `rock`) {
          result = `tied`;
        } else if (commove === `paper`) {
          result = `lose`;
        } else if (commove === `scissor`) {
          result = `win`;
        }

        alert(`You chose rock, computer chose ${commove},
                you ${result}`);
      "
    >
      Rock
    </button>

      onclick="

          result = `win`;

        } else if (commove === `scissor`) {
          result = `lose`;

          result = `tied`;

        alert(`You chose scissor, computer chose ${commove},
