<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuctionDesk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <h1>Online Cloth Store</h1>
    </header>

    <div class="form-card">
      <h2>List a Product</h2>
      <div class="fields">
        <input type="text" id="name" placeholder="Product name" />
        <input
          type="number"
          id="starting-price"
          placeholder="Starting price ($)"
          min="0"
        />
      </div>
      <button class="btn-submit" onclick="addProduct()">
        Add to Auction 
      </button>
    </div>

    <div id="products"></div>
    <div id="empty"><span>⬡</span>No lots yet — list a product above.</div>

    <script>
      const STORAGE_KEY = "auctiondesk_products";

      // ── State ──────────────────────────────────────────────────────────────
      let products = load();

      function load() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
      }

      // ── Add product ────────────────────────────────────────────────────────
      function addProduct() {
        const nameEl = document.getElementById("name");
        const priceEl = document.getElementById("starting-price");
        const name = nameEl.value.trim();
        const price = parseFloat(priceEl.value);

        if (!name || isNaN(price) || price < 0) {
          nameEl.style.borderColor = !name ? "var(--red)" : "var(--border)";
          priceEl.style.borderColor =
            isNaN(price) || price < 0 ? "var(--red)" : "var(--border)";
          return;
        }
        nameEl.style.borderColor = priceEl.style.borderColor = "var(--border)";

        const product = {
          id: Date.now(),
          name,
          startingPrice: price,
          currentPrice: price,
          bids: 0,
        };
        products.push(product);
        save();
        renderCard(product);
        updateEmpty();

        nameEl.value = "";
        priceEl.value = "";
        nameEl.focus();
      }

      // ── Bid ────────────────────────────────────────────────────────────────
      function placeBid(id) {
        const product = products.find((p) => p.id === id);
        const inputEl = document.getElementById(`bid-${id}`);
        const errorEl = document.getElementById(`err-${id}`);
        const newPrice = parseFloat(inputEl.value);

        if (isNaN(newPrice) || newPrice <= product.currentPrice) {
          errorEl.textContent = `Bid must be higher than $${fmt(product.currentPrice)}`;
          inputEl.style.borderColor = "var(--red)";
          setTimeout(() => {
            errorEl.textContent = "";
            inputEl.style.borderColor = "var(--border)";
          }, 2500);
          return;
        }

        product.currentPrice = newPrice;
        product.bids++;
        save();

        // update display
        document.getElementById(`price-${id}`).textContent = fmt(newPrice);
        document.getElementById(`bids-${id}`).innerHTML =
          `<span>${product.bids}</span> bid${product.bids !== 1 ? "s" : ""} placed`;
        inputEl.value = "";
        inputEl.style.borderColor = "var(--border)";
        errorEl.textContent = "";
        inputEl.placeholder = `> $${fmt(newPrice)}`;
      }

      // ── Delete ─────────────────────────────────────────────────────────────
      function deleteProduct(id) {
        products = products.filter((p) => p.id !== id);
        save();
        const el = document.getElementById(`card-${id}`);
        if (el) {
          el.style.transition = "opacity .25s, transform .25s";
          el.style.opacity = "0";
          el.style.transform = "scale(.95)";
          setTimeout(() => el.remove(), 260);
        }
        updateEmpty();
      }

      // ── Render ─────────────────────────────────────────────────────────────
      function fmt(n) {
        return Number(n).toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function renderCard(product) {
        const container = document.getElementById("products");
        const div = document.createElement("div");
        div.className = "product-card";
        div.id = `card-${product.id}`;
        div.innerHTML = `
          <button class="btn-delete" onclick="deleteProduct(${product.id})">✕ Remove</button>
          <div class="card-label">Lot #${product.id.toString().slice(-4)}</div>
          <div class="card-name">${escHtml(product.name)}</div>
          <div class="price-row">
            <span class="price-label">Current</span>
            <span class="price-value"><span class="currency">$</span><span id="price-${product.id}">${fmt(product.currentPrice)}</span></span>
          </div>
          <div class="bid-count" id="bids-${product.id}">
            ${
              product.bids === 0
                ? `Started at <span>$${fmt(product.startingPrice)}</span>`
                : `<span>${product.bids}</span> bid${product.bids !== 1 ? "s" : ""} placed`
            }
          </div>
          <div class="bid-row">
            <input type="number" id="bid-${product.id}" placeholder="> $${fmt(product.currentPrice)}" min="${product.currentPrice}" step="any" />
            <button class="btn-bid" onclick="placeBid(${product.id})">Bid ↑</button>
          </div>
          <div class="bid-error" id="err-${product.id}"></div>
        `;
        container.appendChild(div);
      }

      function updateEmpty() {
        document.getElementById("empty").style.display =
          products.length === 0 ? "block" : "none";
      }

      function escHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ── Enter key to submit ────────────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && document.activeElement.id === "starting-price")
          addProduct();
      });

      // ── Init ───────────────────────────────────────────────────────────────
      products.forEach(renderCard);
      updateEmpty();
    </script>
  </body>
</html>
